# odysseus-searxng-settings: 2026-11-25-disable-google-v2
# Bump the marker above whenever this file changes: the searxng entrypoint in
# docker-compose.yml re-renders /etc/searxng/settings.yml when it differs.
use_default_settings: true

server:
  secret_key: "__SEARXNG_SECRET__"

search:
  formats:
    - html
    - json

# Engine set verified from the home egress IP (2026-11-25). Upstream defaults
# google* / brave / duckduckgo / startpage* rate-limit, CAPTCHA, or degrade
# home IP reputation when scraped, so keep them explicitly disabled under
# use_default_settings: true. bing, yandex, seznam and mwmbl remain enabled.
# Re-probe per engine with
#   curl -G localhost:8080/search --data-urlencode q=test \
#     --data-urlencode engines=<name> --data-urlencode format=json
# before changing this list.
engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: seznam
    disabled: false
  - name: mwmbl
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: google
    disabled: true
  - name: google images
    disabled: true
  - name: google news
    disabled: true
  - name: google scholar
    disabled: true
  - name: google videos
    disabled: true
  - name: startpage
    disabled: true
  - name: startpage images
    disabled: true
  - name: startpage news
    disabled: true
