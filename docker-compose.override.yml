services:
  odysseus:
    # The container can run repo test suites (npm ci / vitest) against
    # /app/work, which is uncapped by default and can take the whole host
    # down. Hard ceiling here; a host-specific overlay may cap lower.
    mem_limit: 24g
    memswap_limit: 24g
    # markitdown (.docx/.pptx/.xlsx extraction) lives in
    # requirements-optional.txt behind this build arg. Without it every
    # Office attachment silently degrades to a "[Attached document: ...]"
    # banner and the model never sees the content.
    build:
      context: .
      args:
        INSTALL_OPTIONAL: "true"
    # Both published ports are pinned explicitly so that no single variable
    # governs both: APP_BIND=0.0.0.0 must never expose the Dev Preview admin
    # proxy (7100) to the LAN.
    #
    # 7000 follows APP_BIND and defaults to loopback, matching .env.example.
    # Front it with a reverse proxy (e.g. tailscale serve) for remote access.
    # Set APP_BIND=0.0.0.0 in .env only if LAN clients genuinely need it --
    # Odysseus authenticates (AUTH_ENABLED=true, LOCALHOST_BYPASS=false), but
    # loopback is the default posture.
    #
    # 7100 -> always loopback. It is admin-gated dev tooling, not a user
    # surface; front it with the same reverse proxy if needed.
    ports: !override
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
      - "127.0.0.1:${DEV_PREVIEW_PROXY_PORT:-7100}:${DEV_PREVIEW_PROXY_PORT:-7100}"
    # The SSH identity dir is mounted read-only: with rw a compromised
    # container could plant or rewrite keys. Runtime writes are not needed
    # as long as every Host block in .ssh/config sets StrictHostKeyChecking
    # yes with a pinned UserKnownHostsFile (strict mode never adds host keys;
    # it matches or fails) and known_hosts already covers every host dialed.
    # Known cost: the Cookbook "generate a remote-server key here" path fails
    # with a clear read-only error; remount rw for that one operation if
    # ever wanted.
    volumes:
      - ${ODYSSEUS_DATA_DIR:-./data}/ssh:/app/.ssh:ro,z
    environment:
      - PATH=/app/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - CLAUDE_CONFIG_DIR=/app/.local/share/claude
      - GIT_SSH_COMMAND=ssh -F /app/.ssh/config
